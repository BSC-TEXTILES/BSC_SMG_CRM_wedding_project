# BSC Textiles - Nginx Reverse Proxy Configuration
# Production-ready configuration with HTTPS, rate limiting, and security headers

# ─── Rate Limiting Zones ───────────────────────────────────────────────
# Limit login/auth endpoints to prevent brute force
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ─── Upstream Backend Servers ──────────────────────────────────────────
upstream backend {
    least_conn;
    server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
    # Add more backend servers for load balancing:
    # server 127.0.0.1:5001 max_fails=3 fail_timeout=30s;
    # server 127.0.0.1:5002 max_fails=3 fail_timeout=30s;
    
    keepalive 32;
}

# ─── HTTP to HTTPS Redirect ────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name bsctextiles.in www.bsctextiles.in;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ─── Main HTTPS Server ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bsctextiles.in www.bsctextiles.in;

    # Hide backend server identity
    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # ─── SSL/TLS Configuration ────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/bsctextiles.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bsctextiles.in/privkey.pem;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # SSL session settings
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ─── Security Headers ───────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://www.google.com https://cdn.jsdelivr.net https://unpkg.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.gstatic.com;
        img-src 'self' data: blob: https: https://www.gstatic.com;
        font-src 'self' https://fonts.gstatic.com data:;
        connect-src 'self' wss: https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://firebaselogging.googleapis.com https://www.googleapis.com https://generativelanguage.googleapis.com;
        media-src 'self' data: blob:;
        object-src 'none';
        frame-src 'none';
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
        upgrade-insecure-requests;
    " always;

    # ─── Connection Limits ──────────────────────────────────────────────
    limit_conn conn_limit 50;

    # ─── Client Settings ────────────────────────────────────────────────
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    # ─── Proxy Settings ─────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_cache_bypass $http_upgrade;
    
    # Timeouts
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Buffering
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    
    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # ─── Health Check Endpoint (No Rate Limiting) ───────────────────────
    location /health {
        proxy_pass http://backend;
        access_log off;
    }

    location /api/health {
        proxy_pass http://backend;
        access_log off;
    }

    # ─── Authentication Endpoints (Strict Rate Limiting) ────────────────
    location ~ ^/api/auth/(login|verify-2fa|resend-2fa|lock-status|captcha|request-password-reset|verify-password-reset-token|reset-password|send-verification|verify-email|resend-verification) {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        
        proxy_pass http://backend;
        
        # Additional security for auth endpoints
        add_header X-RateLimit-Limit "5" always;
        add_header X-RateLimit-Remaining "" always;
    }

    # ─── API Endpoints (Moderate Rate Limiting) ─────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;
        
        proxy_pass http://backend;
        
        add_header X-RateLimit-Limit "30" always;
    }

    # ─── Static Assets (Long-term Caching) ──────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        proxy_pass http://backend;
        
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # ─── Frontend Assets (Short-term Caching) ───────────────────────────
    location /assets/ {
        proxy_pass http://backend;
        
        expires 30d;
        add_header Cache-Control "public";
        add_header Vary "Accept-Encoding";
    }

    # ─── Main Application (SPA Fallback) ────────────────────────────────
    location / {
        proxy_pass http://backend;
        
        # SPA fallback for client-side routing
        try_files $uri $uri/ @backend;
    }

    location @backend {
        proxy_pass http://backend;
    }

    # ─── Block Access to Sensitive Files ────────────────────────────────
    location ~ /\.(git|env|htaccess|htpasswd) {
        deny all;
        return 404;
    }

    location ~* \.(log|sql|bak|backup)$ {
        deny all;
        return 404;
    }

    # ─── Error Pages ────────────────────────────────────────────────────
    error_page 429 /429.html;
    location = /429.html {
        root /var/www/html;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/html;
        internal;
    }
}

